<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Too Doo List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="app-title">
      <div>
        <p class="eyebrow">Daily planner</p>
        <h1 id="app-title">Too Doo List</h1>
        <p class="subtitle">Capture tasks, mark progress, and keep your day tidy.</p>
      </div>
      <div class="date-card" aria-label="Today's date">
        <span id="weekday">Today</span>
        <strong id="monthDay">--</strong>
      </div>
    </section>

    <section class="task-panel" aria-label="Task manager">
      <form id="taskForm" class="task-form" autocomplete="off">
        <label class="sr-only" for="taskInput">Add a new task</label>
        <input id="taskInput" type="text" maxlength="90" placeholder="Add a task..." required>
        <button type="submit">Add</button>
      </form>

      <div class="toolbar">
        <div class="filters" aria-label="Filter tasks">
          <button class="filter-btn active" type="button" data-filter="all">All</button>
          <button class="filter-btn" type="button" data-filter="active">Active</button>
          <button class="filter-btn" type="button" data-filter="completed">Done</button>
        </div>
        <button id="clearDone" class="ghost-btn" type="button">Clear done</button>
      </div>

      <div class="stats" aria-live="polite">
        <span id="taskCount">0 tasks left</span>
        <span id="doneCount">0 completed</span>
      </div>

      <ul id="taskList" class="task-list" aria-label="Tasks"></ul>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon" aria-hidden="true">✓</div>
        <h2>No tasks yet</h2>
        <p>Add your first task and give your day a little shape.</p>
      </div>
    </section>
  </main>

  <template id="taskTemplate">
    <li class="task-item">
      <label class="task-check">
        <input type="checkbox">
        <span aria-hidden="true"></span>
      </label>
      <span class="task-title"></span>
      <button class="delete-btn" type="button" aria-label="Delete task">×</button>
    </li>
  </template>

  <script src="script.js"></script>
</body>
</html>
